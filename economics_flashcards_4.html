<style>
  :root{

  .wrap{max-width:640px;margin:0 auto;}
  h1{font-size:1.3rem;text-align:center;margin:8px 0 16px;}

  .dot{width:9px;height:9px;border-radius:50%;}

  }
  .controls{display:flex; gap:8px; justify-content:center; margin-bottom:12px; flex-wrap:wrap;}
  .progressbar{
    height:6px; background:#334155; border-radius:3px; overflow:hidden; margin-bottom:16px;
  }
  .progressfill{height:100%; background:var(--accent); transition:width .3s;}
  .card{
    background:var(--card); border-radius:18px; padding:28px 22px; min-height:220px;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.35); cursor:pointer;
    position:relative; user-select:none;
  }
  .cat{
    position:absolute; top:12px; left:14px; font-size:0.7rem; color:var(--muted);
    background:#0f172a; padding:3px 9px; border-radius:999px;
  }
  .term{font-size:1.6rem; font-weight:700; margin-bottom:6px;}
  .hint{color:var(--muted); font-size:0.8rem; margin-top:10px;}
  .desc{font-size:1rem; line-height:1.6; margin-top:8px;}
  .formula{
    margin-top:14px; font-family:monospace; font-size:1rem; color:var(--accent);
    background:#0f172a; padding:8px 14px; border-radius:8px;
  }
  .rate-row{display:flex; gap:10px; margin-top:18px;}
  .rate-btn{
    flex:1; padding:12px 6px; border:none; border-radius:12px; font-size:0.85rem;
    font-weight:600; cursor:pointer; color:#0f172a;
  }
  .rate-ng{background:var(--ng);}
  .rate-mid{background:var(--mid);}
  .rate-ok{background:var(--ok);}
  .navrow{display:flex; gap:10px; margin-top:14px;}
  .navbtn{
    flex:1; padding:10px; border-radius:10px; border:1px solid #334155; background:transparent;
    color:var(--text); cursor:pointer; font-size:0.85rem;
  }
  .navbtn:active{background:#334155;}
  .footer{text-align:center; color:var(--muted); font-size:0.75rem; margin-top:16px;}
  .badge{
    position:absolute; top:12px; right:14px; font-size:0.7rem; padding:3px 9px; border-radius:999px;
  }
  .b-ng{background:rgba(248,113,113,.2); color:var(--ng);}
  .b-mid{background:rgba(251,191,36,.2); color:var(--mid);}
  .b-ok{background:rgba(74,222,128,.2); color:var(--ok);}
  .b-new{background:#334155; color:var(--muted);}
  .loading{text-align:center; margin-top:60px; color:var(--muted);}
  .tabs{display:flex; gap:8px; justify-content:center; margin-bottom:14px;}
  .tabbtn{
    background:var(--card); color:var(--muted); border:1px solid #334155; border-radius:999px;
    padding:6px 16px; font-size:0.85rem; cursor:pointer;
  }
  .tabbtn.active{background:var(--accent); color:#0f172a; border-color:var(--accent); font-weight:700;}
  .synctag{font-size:0.7rem; padding:2px 8px; border-radius:999px; margin-left:6px;}
  .sync-ok{background:rgba(74,222,128,.2); color:var(--ok);}
  .sync-off{background:rgba(148,163,184,.2); color:var(--muted);}
  table.hist{width:100%; border-collapse:collapse; font-size:0.8rem;}
  table.hist th, table.hist td{padding:6px 8px; border-bottom:1px solid #334155; text-align:left;}
  table.hist th{color:var(--muted); font-weight:600;}
  .histwrap{background:var(--card); border-radius:14px; padding:12px; max-height:520px; overflow:auto;}
  .lvpill{padding:2px 8px; border-radius:999px; font-size:0.75rem; font-weight:600;}
</style>

["景気","景気循環","景気拡大と後退が繰り返されること",""],
["景気","景気拡張","経済活動が拡大する局面",""],
["景気","景気後退","経済活動が縮小する局面",""],
["景気","景気の山","景気拡張のピーク",""],
["景気","景気の谷","景気後退の底",""],
["景気","先行系列","景気に先行して動く経済指標",""],
["景気","一致系列","景気とほぼ同時に動く指標",""],
["景気","遅行系列","景気に遅れて動く指標",""],
["国際","為替レート","2国間の通貨交換比率",""],
["国際","円高","円の価値が上昇すること",""],
["国際","円安","円の価値が低下すること",""],
["国際","固定相場制","為替レートを一定水準に維持する制度",""],
["国際","変動相場制","市場の需要・供給によって為替が決まる制度",""],
["成長","労働生産性","労働1単位当たりの生産量","労働生産性＝GDP/労働投入量"],
["成長","経済成長率","GDPなどの増加率","(今年GDP−前年GDP)/前年GDP×100"]
].map((t,i)=>({id:"t"+i, cat:t[0], term:t[1], desc:t[2], formula:t[3]}));

let progress = {}; // id -> 0(未) 1(あいまい) 2(理解)
let order = [];
let idx = 0;
let flipped = false;
let filterCat = "all";
let view = "study"; // "study" | "history"
let historyRows = [];
let historyLoading = false;
let lastSyncOk = null; // null=未送信 true=成功 false=失敗

const KEY = "econ_progress_v1";
const LEVEL_LABEL = {0:"未理解",1:"あいまい",2:"理解済"};

async function sendToSheet(cur, lv){
  try{
    await fetch(GAS_URL, {
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({
        timestamp: new Date().toLocaleString("ja-JP"),
        no: cur.id.replace("t",""),
        category: cur.cat,
        term: cur.term,
        level: LEVEL_LABEL[lv]
      })
    });
    lastSyncOk = true;
  }catch(e){
    lastSyncOk = false;
  }
}

async function loadHistory(){
  historyLoading = true;
  render();
  try{
    const res = await fetch(GAS_URL, {method:"GET"});
    const data = await res.json();
    historyRows = data.reverse(); // 新しい順
  }catch(e){
    historyRows = null; // 読み込み失敗の目印
  }
  historyLoading = false;
  render();
}

async function loadProgress(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) progress = JSON.parse(raw);
  }catch(e){ progress = {}; }
}
async function saveProgress(){
  try{ localStorage.setItem(KEY, JSON.stringify(progress)); }catch(e){}
}

function buildOrder(){
  order = TERMS.filter(t=> filterCat==="all" || t.cat===filterCat).map(t=>t.id);
  idx = 0;
  flipped = false;
}

function shuffleOrder(){
  for(let i=order.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [order[i],order[j]]=[order[j],order[i]];
  }
  idx = 0; flipped=false;
}

function levelCounts(){
  let c = {0:0,1:0,2:0,new:0};
  TERMS.forEach(t=>{
    const p = progress[t.id];
    if(p===undefined) c.new++;
    else c[p]++;
  });
  return c;
}

function categories(){
  return ["all", ...Array.from(new Set(TERMS.map(t=>t.cat)))];
}

function renderTabs(){
  return `
    <div class="tabs">
      <button class="tabbtn ${view==='study'?'active':''}" id="tabStudy">📇 学習</button>
      <button class="tabbtn ${view==='history'?'active':''}" id="tabHistory">📜 履歴（スプレッドシート）</button>
    </div>
  `;
}

function attachTabHandlers(){
  document.getElementById("tabStudy").onclick = ()=>{ view="study"; render(); };
  document.getElementById("tabHistory").onclick = ()=>{
    view="history";
    if(historyRows.length===0) loadHistory(); else render();
  };
}

function renderHistoryView(){
  const app = document.getElementById("app");
  let body;
  if(historyLoading){
    body = `<div class="loading">読み込み中...</div>`;
  } else if(historyRows===null){
    body = `<div class="loading">履歴の取得に失敗しました。スプレッドシートのApps Script設定をご確認ください。</div>`;
  } else if(historyRows.length===0){
    body = `<div class="loading">まだ記録がありません。学習タブで評価すると、ここに記録が積み重なります。</div>`;
  } else {
    const rows = historyRows.map(r=>{
      const cls = r.level==="理解済"?"b-ok":r.level==="あいまい"?"b-mid":"b-ng";
      return `<tr>
        <td>${r.timestamp}</td>
        <td>${r.category}</td>
        <td>${r.term}</td>
        <td><span class="lvpill ${cls}">${r.level}</span></td>
      </tr>`;
    }).join("");
    body = `
      <div class="histwrap">
        <table class="hist">
          <thead><tr><th>日時</th><th>分野</th><th>用語</th><th>理解度</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }
  app.innerHTML = `
    ${renderTabs()}
    <div class="controls" style="margin-bottom:10px;">
      <button class="navbtn" id="refreshBtn" style="flex:none;padding:6px 14px;">🔄 最新の記録を取得</button>
    </div>
    ${body}
  `;
  attachTabHandlers();
  const rb = document.getElementById("refreshBtn");
  if(rb) rb.onclick = loadHistory;
}

function render(){
  if(view==="history"){ renderHistoryView(); return; }
  const app = document.getElementById("app");
  if(order.length===0){
    app.innerHTML = `${renderTabs()}<div class="loading">このカテゴリーには用語がありません</div>`;
    attachTabHandlers();
    return;
  }
  const cur = TERMS.find(t=>t.id===order[idx]);
  const p = progress[cur.id];
  const badgeClass = p===undefined? "b-new" : p===0? "b-ng" : p===1? "b-mid":"b-ok";
  const badgeText = p===undefined? "未学習" : p===0? "未理解" : p===1? "あいまい":"理解済";
  const counts = levelCounts();
  const total = TERMS.length;
  const doneRatio = Math.round(((counts[2])/total)*100);

  const syncTag = lastSyncOk===null ? "" :
    lastSyncOk ? `<span class="synctag sync-ok">✅ シート同期済</span>` :
    `<span class="synctag sync-off">⚠️ 同期失敗</span>`;

  app.innerHTML = `
    ${renderTabs()}
    <div class="stats">
      <div class="stat"><span class="dot" style="background:var(--ng)"></span>未理解 ${counts[0]}</div>
      <div class="stat"><span class="dot" style="background:var(--mid)"></span>あいまい ${counts[1]}</div>
      <div class="stat"><span class="dot" style="background:var(--ok)"></span>理解済 ${counts[2]}</div>
      <div class="stat"><span class="dot" style="background:#334155"></span>未学習 ${counts.new}</div>
      ${syncTag}
    </div>
    <div class="progressbar"><div class="progressfill" style="width:${doneRatio}%"></div></div>
    <div class="controls">
      <select id="catSelect"></select>
      <select id="modeSelect">
        <option value="all">全て表示</option>
        <option value="review">要復習(未理解+あいまい)のみ</option>
      </select>
      <button class="navbtn" id="shuffleBtn" style="flex:none;padding:6px 14px;">🔀 シャッフル</button>
    </div>
    <div class="card" id="card">
      <div class="cat">${cur.cat}</div>
      <div class="badge ${badgeClass}">${badgeText}</div>
      ${!flipped ? `
        <div class="term">${cur.term}</div>
        <div class="hint">タップして意味を表示 (${idx+1}/${order.length})</div>
      ` : `
        <div class="term" style="font-size:1.2rem;">${cur.term}</div>
        <div class="desc">${cur.desc}</div>
        ${cur.formula ? `<div class="formula">${cur.formula}</div>` : ""}
      `}
    </div>
    ${flipped ? `
    <div class="rate-row">
      <button class="rate-btn rate-ng" data-lv="0">😵 未理解</button>
      <button class="rate-btn rate-mid" data-lv="1">😐 あいまい</button>
      <button class="rate-btn rate-ok" data-lv="2">😎 理解済</button>
    </div>` : ""}
    <div class="navrow">
      <button class="navbtn" id="prevBtn">← 前へ</button>
      <button class="navbtn" id="nextBtn">次へ →</button>
    </div>
    <div class="footer">全${total}語 / 表示中 ${order.length}語 ・ 進捗は自動保存されます</div>
  `;

  attachTabHandlers();
  const catSelect = document.getElementById("catSelect");
  categories().forEach(c=>{
    const o = document.createElement("option");
    o.value=c; o.textContent = c==="all" ? "全カテゴリー" : c;
    if(c===filterCat) o.selected=true;
    catSelect.appendChild(o);
  });
  catSelect.onchange = ()=>{ filterCat = catSelect.value; buildOrder(); render(); };

  document.getElementById("modeSelect").onchange = (e)=>{
    if(e.target.value==="review"){
      order = TERMS.filter(t=>{
        if(filterCat!=="all" && t.cat!==filterCat) return false;
        const p = progress[t.id];
        return p===undefined || p===0 || p===1;
      }).map(t=>t.id);
    } else {
      buildOrder();
    }
    idx=0; flipped=false; render();
  };

  document.getElementById("shuffleBtn").onclick = ()=>{ shuffleOrder(); render(); };
  document.getElementById("card").onclick = ()=>{ flipped=!flipped; render(); };
  document.getElementById("prevBtn").onclick = ()=>{ idx=(idx-1+order.length)%order.length; flipped=false; render(); };
  document.getElementById("nextBtn").onclick = ()=>{ idx=(idx+1)%order.length; flipped=false; render(); };

  document.querySelectorAll(".rate-btn").forEach(b=>{
    b.onclick = async (e)=>{
      e.stopPropagation();
      const lv = parseInt(b.dataset.lv);
      progress[cur.id] = lv;
      await saveProgress();
      sendToSheet(cur, lv); // 非同期でスプレッドシートへ送信（結果を待たず進む）
      idx=(idx+1)%order.length; flipped=false; render();
    };
  });
}

(async function init(){
  await loadProgress();
  buildOrder();
  render();
})();
</script>
</body>
</html>
